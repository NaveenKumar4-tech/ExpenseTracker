<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up</title>
  <link rel="stylesheet" href="{% static 'css/auth.css' %}" />
</head>
<body>
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Sign up to get started</p>

    <div id="form-message" class="message-box"></div>

    <form id="signup-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="johndoe" required />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="john@example.com" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" minlength="6" required />
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" minlength="6" required />
      </div>

      <button type="submit" class="btn-submit">Sign Up</button>
    </form>

    <p class="switch-link">Already have an account? <a href="/login/">Log in</a></p>
  </div>

  <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
